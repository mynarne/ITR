<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
<title id="title">ITR: real?</title>
<desc id="desc">A hand-drawn stick figure rests a hand on its chin and eyes the letters AI, holding a blue magnifying glass low.</desc>
<path fill="#fff" d="M0 0H500V320H0Z"/>
<g fill="none" stroke="#171615" stroke-linecap="round" stroke-linejoin="round">
<!-- The frame is drawn as four individual pen strokes. -->
<path d="M268 79q53 1 99-1l70 1" stroke-width="4.9"/>
<path d="M437 79l1 41-1 78" stroke-width="4.3"/>
<path d="M437 198l-68-1-101 2" stroke-width="5.2"/>
<path d="M268 199l-1-46 1-74" stroke-width="4.5"/>
<!-- Skeptical lean: chin in hand, weight back on one leg. -->
<path d="M163 116q-10-5-21-1-10 3-16 13-8 11-5 22 2 14 13 20 11 7 24 3 11-4 17-15 7-12 1-25-4-11-13-17Z" stroke-width="2.8"/>
<path d="M163 137q4-1 9 1m-15 11h.2m12-3h.2" stroke-width="2.6"/>
<path d="M169 159q-5 0-9 2" stroke-width="1.8"/>
<path d="M147 176q-9 16-14 34l-6 23" stroke-width="2.9"/>
<path d="M142 185q-12 9-13 19 9-3 17-14l10-15" stroke-width="2.7"/>
<path d="M155 176q4-6 9-7m-9 6 1-5" stroke-width="1.9"/>
<path d="M139 191q17 14 29 17l37 10" stroke-width="2.7"/>
<path d="M127 232q-16 2-34 11-4 17-4 36l-8 1m46-48 31 9 9 34 11 1" stroke-width="2.8"/>
<!-- Handwritten 'real?' -->
<path d="M84 92l-6-18m4 12q2-11 8-13m3 11q12-7 9-14-4-3-8 5-4 8 2 12 5 1 10-4m14-15q-4-6-9 1-4 5-4 12 1 5 6 3 5-2 7-13l4 10m12-2q-4-10-9-25m22 5q5-12 14-12 8 0 8 8 0 5-6 9-4 4-3 9m1 8h.3" stroke-width="1.55"/>
<!-- Handwritten 'AI', deliberately loose. -->
<path d="M307 162q7-25 17-42 7-6 12 4 8 14 14 38m-36-16 23-4m24-23 24-2m-12 2 2 34m-12 3 24-3" stroke-width="2"/>
</g>
<!-- The blue lens is held lower, leaving the thinking pose readable. -->
<g transform="translate(5 27) rotate(6 213 167)">
<path d="M199 203q7-16 19-39" fill="none" stroke="#a86c46" stroke-width="6.2" stroke-linecap="round"/>
<path d="M232 133c-9-3-20 2-23 11-4 11 3 22 13 23 12 1 19-7 20-17 0-8-3-14-10-17Z" fill="#a7ddf2" stroke="#098ec0" stroke-width="4.4" stroke-linejoin="round"/>
<path d="M215 155l16-16m-9 21 13-12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
</g>
</svg>

.playback{padding:15px 18px 12px;border:1px solid #b9c5b9;background:#eef2e7;border-radius:5px}.controls,.track,.group,.space,.aux,.head,.status{display:flex;align-items:center}.controls{gap:8px;flex-wrap:wrap}.controls button,.aux button{min-height:36px;padding:5px 11px;border:1px solid #b6c3b7;background:var(--white);border-radius:4px;font-weight:650;font-size:13px}.controls button.primary{background:var(--green);border-color:var(--green);color:white;min-width:76px}.controls button:hover:not(:disabled),.aux button:hover:not(:disabled){filter:brightness(.94)}.controls label{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;min-height:36px}.controls input[type=checkbox]{accent-color:var(--green);width:17px;height:17px}.cursor{font:600 12px var(--mono);color:var(--dim);white-space:nowrap}.track{gap:14px;margin-top:9px}.track input{min-width:35px;flex:1;height:20px;accent-color:var(--green);cursor:pointer}.track time{color:var(--dim);font-size:12px}.bodygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(258px,26%);gap:15px;margin-top:18px;align-items:start}.panel{background:var(--white);border:1px solid var(--line);border-radius:5px;min-width:0;overflow:hidden}.head{gap:10px;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}.head small{font-size:11px;color:var(--dim)}.aux{gap:7px}.aux button{padding:4px 8px;font-size:12px}.active-count{color:var(--green);font-weight:700;font-size:12px;white-space:nowrap}

-color:#c2a35b}.card[data-state=not_run]{background:#f2f3f0;color:#5b625d;border:1px dashed #9da69e}.playing.motion .card[data-state=running]{animation:breathe 1.9s ease-in-out infinite}.card[data-state=running]::after{content:"";position:absolute;right:4px;top:3px;width:4px;height:4px;border-radius:50%;background:#287448}.playing.motion .card[data-state=running]::after{animation:trace 1.9s ease-in-out infinite}.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}.legend i{font-style:normal;font-weight:800;margin-right:3px}.legend [data-key=failed]{color:var(--red)}.legend [data-key=blocked]{color:var(--ochre)}.legend [data-key=running]{color:var(--green)}@keyframes breathe{50%{box-shadow:0 0 0 2px #5dab7640}}@keyframes trace{0%,100%{right:4px}50%{right:calc(100% - 8px)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

;color:var(--dim)}footer{padding-block:16px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;display:flex;gap:12px;justify-content:space-between}.skip{position:absolute;left:-3000px}.skip:focus{left:5px;top:5px;z-index:20;background:white;padding:6px}.noscript{padding:20px;}
@media(min-width:1550px){.card{min-height:51px}.stagecell{padding-block:9px}}@media(max-width:950px){.bodygrid{grid-template-columns:minmax(0,1fr) minmax(224px,27%)}.brandbar,main,footer{padding-inline:14px}.head{padding-inline:10px}.inspect-body{padding:11px}.stagecell{padding:7px}.summary-body{grid-template-columns:minmax(0,1fr) 130px}}@media(max-width:730px){.bodygrid{display:flex;flex-direction:column}.bodygrid>*,.left{width:100%}.scope{display:none}.hero{margin:19px 0 12px}.playback{padding:10px}.controls button,.aux button,.controls label{min-height:44px}.track{flex-wrap:wrap;column-gap:9px;row-gap:1px}.track time{display:block;width:100%;text-align:right;font-size:10px}.controls{gap:4px}.controls label{font-size:12px}.head h2{font-size:17px}.stagecell{padding:7px}.summary-body{grid-template-columns:minmax(0,1fr) 86px;gap:7px;padding-inline:8px}.defect-metric{padding-left:7px}.defect-metric b{font-size:27px}.legend{gap:5px 10px}.scope{min-width:0}.archive{margin-top:8px}footer{display:block}.inspect-body{padding:14px}}@media(max-width:390px){.active-count{display:none}.controls label{margin-left:2px}.summary-body{grid-template-columns:1fr}.defect-metric{border-left:0;border-top:1px solid var(--line);padding:4px 0}.defect-metric b{font-size:25px}.full-name{font-size:10px}}
</style></head><body>
<a class="skip" href="#controls">재생 조작으로 건너뛰기</a>
<header class="top"><div class="brandbar"><b class="brand">ITR</b><span class="full-name" lang="en">Is This Real?</span><span class="demo">리플레이 데모</span></div></header>
<main><div class="hero"><div><div class="eyebrow" id="run-meta"></div><h1>검증 리플레이</h1><p class="sub" id="project"></p></div><div class="scope"><div>발주자·사용자 승인 · 최종 기록</div><strong id="approval"></strong></div></div>
<noscript><p class="noscript">리플레이를 탐색하려면 JavaScript를 켜세요. 같은 기록의 report.md와 print.html은 스크립트 없이 열립니다.</p></noscript>
<section class="playback" id="controls" aria-label="이벤트 재생"><div class="controls">
<button type="button" class="primary" id="play">▶ 재생</button><button type="button" id="step-back" aria-label="이전 이벤트">‹ 이전</button><button type="button" id="step-next" aria-label="다음 이벤트">다음 ›</button><button type="button" id="end">끝으로</button><label><input type="checkbox" id="reduce">모션 줄이기</label></div>
<div class="track"><label class="cursor" for="seek" id="cursor">이벤트</label><input type="range" id="seek" min="0" step="1" value="0" aria-label="리플레이 이벤트 위치"><time id="clock"></time></div></section>
<div class="bodygrid"><div class="left"><section class="panel" aria-labelledby="flow-heading"><div class="head"><h2 id="flow-heading">검증 흐름</h2><div class="aux"><span class="active-count" id="active-count"></span><button type="button" id="current">현재 작업으로</button></div></div>
<div class="scroller" tabindex="0" role="region" aria-label="검토 역할과 단계별 흐름. 좁은 창에서는 좌우로 스크롤할 수 있습니다."><div class="graph" id="board"></div></div>
<div class="legend"><span data-key="running"><i>●</i>실행 중</span><span><i>✓</i>통과</span><span data-key="failed"><i>×</i>실패</span><span data-key="blocked"><i>!</i>차단</span><span><i>○</i>대기</span><span><i>–</i>미실행</span></div></section>
<section class="panel summary" aria-labelledby="summary-heading"><div class="head"><h2 id="summary-heading">단계별 판정</h2><small>현재 이벤트 기준</small></div><div class="summary-body"><div class="table-scroll"><table id="stage-counts"><thead><tr><th scope="col">단계</th><th scope="col">통과</th><th scope="col">실패</th><th scope="col">차단</th><th scope="col">미실행</th></tr></thead><tbody></tbody></table></div><div class="defect-metric"><div>고유 결함</div><b id="defect-total">0</b> <span id="defect-unit">건</span><p id="defect-note">동일 fingerprint 1건</p></div></div><p class="count-foot" id="count-note"></p></section></div>
<aside class="panel inspect" aria-labelledby="detail-heading"><div class="head"><h2 id="detail-heading" tabindex="-1">검사 상세</h2><small id="detail-method"></small></div><div id="details" class="inspect-body"></div></aside></div>
<p class="archive" id="archive"></p></main><footer><span id="created"></span><span class="digest" id="digest"></span></footer>
<script id="source" type="application/json">/*__ITR_DATA__*/</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("source").textContent);
const r=data.record, inp=r.input, events=r.events, checks=inp.checks;
const byId=id=>document.getElementById(id);
const labels={queued:"대기",running:"실행 중",passed:"통과",failed:"실패",blocked:"차단",not_run:"미실행"};
const symbols={queued:"○",running:"●",passed:"✓",failed:"×",blocked:"!",not_run:"–"};
const stages={unit:"단위",integration:"통합",system:"시스템",intersystem:"시스템 간 통합",acceptance:"인수 시나리오"};
const roles={bb_goal:"목표 충족",bb_context:"사용 맥락",bb_boundary:"경계 조건",wb_logic:"내부 로직",wb_contract:"모듈 계약",wb_config:"구성·설정",runner:"실행기"};
const kinds={goal:"제품 목표",rule:"스킬 규칙",requirement:"프로젝트 요구사항"};
const methods={inspection:"인스펙션",execution:"실행 테스트"};
const approvalLabels={not_requested:"요청 전",pending:"승인 대기",approved:"승인",rejected:"반려"};
const phase=Object.keys(stages).filter(s=>checks.some(c=>c.stage===s));
const lanes=Object.keys(roles).filter(k=>checks.some(c=>c.role===k));
const cards=new Map(), states=new Map(), edges=[];
const terminal=["passed","failed","blocked","not_run"];
const dateFormat=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
const kst=s=>dateFormat.format(new Date(s))+" KST";
const n=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x};
const svgNS="http://www.w3.org/2000/svg";
const sn=(tag,attrs)=>{const x=document.createElementNS(svgNS,tag);for(const [key,val] of Object.entries(attrs))x.setAttribute(key,val);return x};
const board=byId("board"), seek=byId("seek"), reduce=byId("reduce");
let pos=0, selected=null, timer=null, currentIndex=0;
const mq=matchMedia("(prefers-reduced-motion: reduce)");reduce.checked=mq.matches;
const cells=new Map(), rows=new Map();
byId("run-meta").textContent=r.round+"차 / 시도 "+r.attempt+"　·　"+(inp.mode==="delta"?"일상 변경분":"정밀")+" 모드";
byId("project").textContent=inp.product+"　/　"+inp.revision;
byId("approval").textContent=approvalLabels[r.approval.status];
byId("created").textContent="기록 생성　"+kst(r.created_at);
byId("digest").textContent="SHA-256　"+data.digest;
byId("archive").textContent=r.run_id+"　·　발주자·사용자 승인 "+approvalLabels[r.approval.status]+(r.previous?"　·　이전 기록 "+r.previous.run_id+" / "+r.previous.reason:"");
seek.max=String(events.length);

const goDetail=n("a",null,"선택한 검사 상세 ↓");goDetail.href="#detail-heading";goDetail.style.cssText="color:var(--green);font-weight:700;margin-left:auto";
document.querySelector(".legend").append(goDetail);
function makeBoard(){
  const widths="102px repeat("+Math.max(1,phase.length)+", minmax(126px, 1fr))";
  board.style.setProperty("--cols",widths);
  board.style.width="100%";board.style.minWidth=(102+126*Math.max(1,phase.length))+"px";
  const head=n("div","row stage-head");
  head.append(n("div","lane-title","검토 역할 / 단계"));
  phase.forEach(k=>head.append(n("div","stage",stages[k])));
  board.append(head);
  for(const role of lanes){
    const row=n("div","row");const title=n("div","lane-title");
    title.append(n("small",null,role.startsWith("bb_")?"블랙박스":role.startsWith("wb_")?"화이트박스":"실행"),n("b",null,roles[role]));row.append(title);
    for(const stage of phase){
      const cell=n("div","stagecell");row.append(cell);
      cells.set(role+"/"+stage,cell);
    }
    board.append(row);
  }
  for(const c of checks){
    const card=n("button","card");card.type="button";card.dataset.check=c.id;
    const state=n("span","status");const mark=n("span","mark");mark.setAttribute("aria-hidden","true");
    state.append(mark,n("span"));card.append(state,n("span","name",c.title));
    card.addEventListener("click",()=>{selected=c.id;update();});
    cells.get(c.role+"/"+c.stage).append(card);cards.set(c.id,card);
  }
  const svg=sn("svg",{class:"flow","aria-hidden":"true"});board.append(svg);
  const defs=sn("defs",{}),marker=sn("marker",{id:"arrow",viewBox:"0 0 6 6",refX:5,refY:3,markerWidth:4,markerHeight:4,orient:"auto"});
  marker.append(sn("path",{d:"M0,0 L6,3 L0,6Z",fill:"#829386"}));defs.append(marker);svg.append(defs);
  for(const c of checks){
    for(const dep of c.depends_on||[]){
      if(!cards.has(dep))continue;
      const path=sn("path",{fill:"none","stroke-width":"1.4","marker-end":"url(#arrow)"});
      svg.append(path);edges.push({from:dep,to:c.id,path});
    }
  }
  const table=byId("stage-counts").querySelector("tbody");
  for(const st of phase){
    const tr=n("tr");tr.dataset.stage=st;const th=n("th",null,stages[st]);th.scope="row";tr.append(th);
    terminal.forEach(s=>{const td=n("td",null,"0");td.dataset.status=s;tr.append(td)});table.append(tr);rows.set(st,tr);
  }
  const draw=()=>requestAnimationFrame(layoutEdges);
  if("ResizeObserver" in window)new ResizeObserver(draw).observe(board);
  window.addEventListener("resize",draw);if(document.fonts)document.fonts.ready.then(draw);draw();
}
function layoutEdges(){
  const base=board.getBoundingClientRect(),svg=board.querySelector(".flow");
  svg.setAttribute("width",base.width);svg.setAttribute("height",base.height);
  for(const e of edges){
    const a=cards.get(e.from).getBoundingClientRect(),b=cards.get(e.to).getBoundingClientRect();
    const y1=a.top+a.height/2-base.top,y2=b.top+b.height/2-base.top;
    let x1,x2,d;
    if(b.left>a.left+10){
      x1=a.right-base.left;x2=b.left-base.left-2;
      const mid=(x1+x2)/2;
      d="M "+x1+" "+y1+" H "+mid+" V "+y2+" H "+x2;
    }else{
      x1=a.right-base.left;x2=b.right-base.left+2;
      const turn=Math.min(base.width-1,Math.max(x1,x2)+5);
      d="M "+x1+" "+y1+" H "+turn+" V "+y2+" H "+x2;
    }
    e.path.setAttribute("d",d);
  }
}
function section(box,label,lines){
  const wrap=n("section","section");wrap.append(n("h4",null,label));
  for(const text of lines)wrap.append(n("p",null,text));
  box.append(wrap);return wrap;
}
function inspect(){
  const box=byId("details");box.replaceChildren();
  const c=checks.find(v=>v.id===selected);
  byId("detail-method").textContent=c?methods[c.method]:"";
  if(!c){box.append(n("p",null,"검사 카드를 선택하세요."));return}
  const st=states.get(c.id),closed=terminal.includes(st);
  const badge=n("span","label",symbols[st]+" "+labels[st]);badge.dataset.state=st;
  box.append(badge,n("h3",null,c.title),n("p","meta-line",c.id+"　·　"+stages[c.stage]+" / "+roles[c.role]));
  const result=closed?r.results.find(x=>x.check_id===c.id):null;
  const last=events.slice(0,pos).reverse().find(e=>e.check_id===c.id);
  if(result||last)section(box,"관찰",[result?result.detail:last.message]);
  const merged=pos===events.length;
  const defects=st==="failed"&&merged?r.defects.filter(d=>d.check_ids.includes(c.id)):[];
  const goalIds=Array.from(new Set(defects.flatMap(d=>d.baseline_ids)));
  const criteria=(ids)=>ids.map(id=>{const b=inp.baselines.find(v=>v.id===id);return b?kinds[b.kind]+" "+b.id+" · "+b.version+"　"+b.text:id});
  section(box,st==="failed"?"깨진 목표·기준":"검사 기준",criteria(goalIds.length?goalIds:c.criteria));
  section(box,"통과 조건",[c.pass_condition]);
  if(c.requires.length)section(box,"필요 능력",c.requires.map(k=>{const cap=inp.capabilities.find(v=>v.id===k);return k+" · "+(cap?.available?"가용":"미지원")}));
  const evidence=Array.from(new Set([...(result?.evidence_ids||[]),...defects.flatMap(d=>d.evidence_ids)]));
  if(evidence.length){
    const area=section(box,"로그·캡처",[]);
    for(const id of evidence){
      const evidenceItem=r.evidence.find(v=>v.id===id);if(!evidenceItem)continue;
      const item=n("div","evidence"),p=data.previews[id]||{};
      item.append(n("b",null,id+" · "+evidenceItem.kind),n("p","meta-line",evidenceItem.path+" · "+(p.status||"미리보기 없음")));
      if(p.text)item.append(n("pre",null,p.text));
      if(p.image){const im=n("img");im.src=p.image;im.alt=id+" 검증 캡처";item.append(im)}
      const hash=n("details"),caption=n("summary",null,"SHA-256 보기");hash.append(caption,n("code",null,evidenceItem.sha256));item.append(hash);area.append(item);
    }
  }
  if(st==="failed"&&!merged){
    const area=section(box,"결함 통합",["역할별 첫 판정이 끝난 뒤 원인과 회귀 검사가 연결됩니다."]);
    const button=n("button",null,"최종 분석 보기");button.type="button";button.id="show-final";button.addEventListener("click",()=>go(events.length));area.classList.add("final-link");area.append(button);
  }
  for(const d of defects){
    section(box,"결함 "+d.id,[d.observed]);
    section(box,"확인된 원인",[d.cause_confirmed||"미확인"]);
    section(box,"가설",[d.hypothesis||"기록 없음"]);
    section(box,"최소 수정 방향",[d.minimal_fix]);
    section(box,"다음 회귀 검사",[d.next_regression]);
  }
}
function update(){
  states.clear();checks.forEach(c=>states.set(c.id,"queued"));
  for(let i=0;i<pos;i++)states.set(events[i].check_id,events[i].state);
  const active=[],counts={};phase.forEach(st=>counts[st]=Object.fromEntries(terminal.map(s=>[s,0])));
  for(const c of checks){
    const s=states.get(c.id),card=cards.get(c.id);
    card.dataset.state=s;card.setAttribute("aria-pressed",String(c.id===selected));
    card.setAttribute("aria-label",c.title+" · "+labels[s]+" · "+methods[c.method]+" · 상세");
    card.firstChild.firstChild.textContent=symbols[s];card.firstChild.lastChild.textContent=labels[s];
    if(s==="running")active.push(c.id);
    if(terminal.includes(s))counts[c.stage][s]++;
  }
  for(const e of edges){
    const waiting=states.get(e.to)==="queued"||states.get(e.from)==="queued";
    const activeEdge=states.get(e.to)==="running";
    e.path.setAttribute("stroke",activeEdge?"#518768":waiting?"#aab4aa":"#829386");
    e.path.setAttribute("stroke-dasharray",waiting?"3 3":"none");
  }
  for(const st of phase)rows.get(st).querySelectorAll("td").forEach(td=>td.textContent=counts[st][td.dataset.status]);
  const merged=pos===events.length;
  byId("defect-total").textContent=merged?new Set(r.defects.map(d=>d.fingerprint)).size:"—";
  byId("defect-unit").textContent=merged?"건":"";
  byId("defect-note").textContent=merged?"동일 fingerprint 1건":"독립 판정 통합 전";
  byId("approval").textContent=merged?approvalLabels[r.approval.status]:"최종 기록에서 확인";
  byId("archive").textContent=r.run_id+(merged?"　·　발주자·사용자 승인 "+approvalLabels[r.approval.status]:"")+(r.previous?"　·　이전 기록 "+r.previous.run_id+" / "+r.previous.reason:"");
  byId("active-count").textContent="실행 중 "+active.length;
  byId("current").disabled=active.length===0;
  byId("step-back").disabled=pos===0;byId("step-next").disabled=byId("end").disabled=pos===events.length;
  byId("play").textContent=timer?"Ⅱ 일시정지":pos===events.length?"↺ 다시 재생":"▶ 재생";
  byId("cursor").textContent="이벤트 "+pos+" / "+events.length;
  const at=pos?events[pos-1].at:r.created_at;byId("clock").dateTime=at;byId("clock").textContent=kst(at);
  const waiting=Array.from(states.values()).filter(s=>s==="queued").length;
  byId("count-note").textContent="대기 "+waiting+"건 · 실행 중 "+active.length+"건"+(pos===events.length?"　/　통합 판정 "+labels[r.decision.status]+" · "+r.decision.reason:"");
  seek.value=String(pos);seek.setAttribute("aria-valuetext",pos+" / "+events.length+" 이벤트");
  document.body.classList.toggle("motion",!reduce.checked);document.body.classList.toggle("playing",Boolean(timer));
  inspect();
}
function stop(){if(timer){clearInterval(timer);timer=null}}
function go(index){
  stop();pos=Math.max(0,Math.min(events.length,index));update();
}
byId("step-back").onclick=()=>go(pos-1);
byId("step-next").onclick=()=>go(pos+1);
byId("end").onclick=()=>go(events.length);
seek.oninput=()=>go(Number(seek.value));
byId("play").onclick=()=>{
  if(timer){stop();update();return}
  if(!events.length)return;
  if(pos===events.length)pos=0;
  timer=setInterval(()=>{pos++;if(pos>=events.length)stop();update()},900);update();
};
reduce.onchange=update;
if(mq.addEventListener)mq.addEventListener("change",()=>{reduce.checked=mq.matches;update()});
byId("current").onclick=()=>{
  const active=checks.filter(c=>states.get(c.id)==="running");if(!active.length)return;
  const c=active[currentIndex++%active.length];selected=c.id;update();
  const card=cards.get(c.id);card.focus({preventScroll:true});card.scrollIntoView({block:"nearest",inline:"center",behavior:"auto"});
};
function initial(){
  // Start at an observed failure if present. Prefer a point with concurrent work.
  const seen=new Map();let failure=null, firstFailure=null, parallel=null;
  for(let i=0;i<events.length;i++){
    const e=events[i];seen.set(e.check_id,e.state);
    if(e.state==="failed"&&!firstFailure){firstFailure=[i+1,e.check_id]}
    if(e.state==="failed")failure=e.check_id;
    const active=Array.from(seen).filter(pair=>pair[1]==="running");
    if(!parallel&&active.length>1)parallel=[i+1,active[0][0]];
    if(failure&&active.length){return [i+1,failure]}
  }
  return firstFailure||parallel||[events.length,checks[0]?.id||null];
}
makeBoard();[pos,selected]=initial();
const hash=typeof location!=="undefined"?location.hash:"";
if(hash.startsWith("#check=")){
  try{ const requested=decodeURIComponent(hash.slice(7));if(cards.has(requested)){pos=events.length;selected=requested} }
  catch(error){ /* Keep the default cursor if the fragment is malformed. */ }
}
update();
</script></body></html>
